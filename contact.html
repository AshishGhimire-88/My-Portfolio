<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Portfolio</title>

    <link rel="stylesheet" href="assets/css/contact.css">
</head>

<body>

<header class="navbar">
    <div class="nav-container">
        <div class="nav-brand">Portfolio</div>
        <ul class="nav-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="resume.html">Resume</a></li>
            <li><a href="My_Projects.html">Projects</a></li>
            <li><a class="active" href="contact.html">Contact</a></li>
        </ul>
    </div>
</header>

<main>

    <section class="page-title">
        <h1>Get In Touch</h1>
        <p>Send me a message — I’ll get back to you soon.</p>
    </section>

    <section class="contact-container">

        <!-- INFO -->
        <div class="contact-info">
            <div class="info-card">
                <h3>Email</h3>
                <p>aghimire915@gmail.com</p>
            </div>

            <div class="info-card">
                <h3>Location</h3>
                <p>Arlington, TX</p>
            </div>
        </div>

        <!-- FORM -->
        <form id="contactForm"
              class="contact-form"
              action="https://docs.google.com/forms/d/e/YOUR_FORM_ID/formResponse"
              method="POST"
              target="hidden_iframe">

            <input type="text" name="entry.1111111111" placeholder="Your Name" required>
            <input type="email" name="entry.2222222222" placeholder="Your Email" required>
            <input type="text" name="entry.3333333333" placeholder="Subject" required>
            <textarea name="entry.4444444444" placeholder="Message" rows="6" required></textarea>

            <button type="submit">Send Message ✈️</button>

        </form>

        <iframe name="hidden_iframe" style="display:none;"></iframe>

    </section>

</main>

<!-- SUCCESS POPUP -->
<div id="popup" class="popup">
    <div class="popup-content">
        <h2>Message Sent ✅</h2>
        <p>Thanks for reaching out. I’ll respond soon.</p>
        <button onclick="closePopup()">Close</button>
    </div>
</div>

<script src="assets/js/contact.js"></script>

</body>
</html>
